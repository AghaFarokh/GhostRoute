name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DEPLOY_DIR="/root/iraniexchange"
            REPO="https://github.com/AghaFarokh/GhostRoute.git"

            cd "$DEPLOY_DIR"

            # First-time setup: initialize git if not already done
            if [ ! -d .git ]; then
              git init
              git remote add origin "$REPO"
            fi

            # Pull latest code (only tracked files, .env is safe in .gitignore)
            git fetch origin master
            git checkout origin/master -- main.py lang.py miniapp.py requirements.txt webapp deploy

            # Install any new dependencies
            ./venv/bin/pip install -q -r requirements.txt

            # Cloudflared tunnel service for the mini app
            chmod +x deploy/tunnel.sh
            if command -v cloudflared >/dev/null; then
              cp deploy/iraniexchange-tunnel.service /etc/systemd/system/
              systemctl daemon-reload
              systemctl enable iraniexchange-tunnel
            fi

            # Restart the bot
            systemctl restart iraniexchange

            echo "Deploy complete. Status:"
            systemctl is-active iraniexchange
            if command -v cloudflared >/dev/null; then
              systemctl restart iraniexchange-tunnel
            fi
