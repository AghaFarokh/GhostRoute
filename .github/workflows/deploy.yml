name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_DIR }}"
            SERVICE_NAME="${{ secrets.SERVICE_NAME }}"
            REPO="https://github.com/${{ github.repository }}.git"

            [ -n "$DEPLOY_DIR" ] && [ -n "$SERVICE_NAME" ] || { echo "Set DEPLOY_DIR and SERVICE_NAME secrets"; exit 1; }

            cd "$DEPLOY_DIR"

            # First-time setup: initialize git if not already done
            if [ ! -d .git ]; then
              git init
              git remote add origin "$REPO"
            fi

            # Pull latest code (only tracked files, .env is safe in .gitignore)
            git fetch origin master
            git checkout origin/master -- main.py lang.py miniapp.py requirements.txt webapp deploy

            # Install any new dependencies
            ./venv/bin/pip install -q -r requirements.txt

            # Cloudflared tunnel service for the mini app (no-op without cloudflared)
            bash deploy/install-tunnel.sh "$DEPLOY_DIR" "$SERVICE_NAME"

            # Restart the bot
            systemctl restart "$SERVICE_NAME"

            echo "Deploy complete. Status:"
            systemctl is-active "$SERVICE_NAME"
