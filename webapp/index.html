<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>GhostRoute</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --fg: var(--tg-theme-text-color, #111827);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --card: var(--tg-theme-secondary-bg-color, #f3f4f6);
    --accent: var(--tg-theme-button-color, #6366f1);
    --accent-fg: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--fg) 10%, transparent);
    --soft: color-mix(in srgb, var(--accent) 14%, transparent);
    --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    --r: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-tg]) { --bg: #0e1116; --fg: #e6e8ec; --hint: #8a93a3; --card: #171b22; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Vazirmatn, system-ui, sans-serif;
         padding: 0 14px calc(150px + env(safe-area-inset-bottom)); }
  html, body { max-width: 100%; overflow-x: hidden; }
  main, .card, .tile, .stat, .body, .kv .v > div, .tiles > *, .grid3 > * { min-width: 0; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* header */
  header { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; }
  .logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 20px;
          background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 50%, #a855f7)); }
  header h1 { font-size: 18px; margin: 0; line-height: 1.1; }
  header small { color: var(--hint); font-size: 12px; }
  header .grow { flex: 1; }
  .chip { padding: 6px 12px; border-radius: 999px; background: var(--card); font-size: 13px; font-weight: 600; }

  /* layout */
  h2 { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--hint); margin: 20px 4px 8px; font-weight: 600; }
  .card { background: var(--card); border-radius: var(--r); padding: 14px; margin-bottom: 10px; border: 1px solid var(--line); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hint { color: var(--hint); font-size: 13px; }
  .mono { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; direction: ltr; text-align: left; unicode-bidi: plaintext; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 22px; line-height: 1.2; }
  .stat span { font-size: 12px; color: var(--hint); }

  /* buttons */
  .btn { padding: 11px 16px; border-radius: 12px; font-weight: 600; background: var(--accent); color: var(--accent-fg); transition: transform .08s, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; }
  .btn.sec { background: var(--soft); color: var(--accent); }
  .btn.ghost { background: transparent; color: var(--hint); }
  .btn.danger { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
  .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
  .btn.icon { padding: 8px; border-radius: 10px; line-height: 0; }
  .btn.block { width: 100%; }

  /* stepper tiles */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
  .tile .lbl { font-size: 12px; color: var(--hint); margin-bottom: 6px; }
  .tile .val { font-size: 26px; font-weight: 700; text-align: center; line-height: 1.1; }
  .tile .val small { font-size: 12px; font-weight: 500; color: var(--hint); display: block; margin-top: 2px; }
  .tile .ctl { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .tile .btn.icon { background: var(--soft); color: var(--accent); width: 36px; height: 36px; display: grid; place-items: center; font-size: 20px; }
  .path { display: flex; align-items: center; justify-content: center; gap: 0; margin: 4px 0 2px; }
  .path i { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .path u { height: 2px; width: 10px; background: var(--accent); opacity: .5; }
  .path.mini i { flex: none; width: 12px; height: 12px; background: var(--line); }
  .path.mini u { width: auto; flex: 1 1 0; min-width: 4px; background: var(--line); opacity: 1; }
  .path.mini i.done { background: var(--accent); }
  .path.mini u.done { background: var(--accent); }
  .path.mini i.cur { box-shadow: 0 0 0 4px var(--soft); background: var(--accent); }

  /* wallet */
  .wallet { display: flex; gap: 12px; align-items: center; }
  .wallet .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--soft); color: var(--accent); flex: none; }
  .wallet .ic.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .wallet .body { flex: 1; min-width: 0; }
  input { width: 100%; font: 13px ui-monospace, Menlo, monospace; padding: 12px; border-radius: 12px; margin-top: 10px; outline: none;
          border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); direction: ltr; }
  input:focus { border-color: var(--accent); }

  /* cycle card */
  .cy .top { display: flex; align-items: center; gap: 8px; }
  .cy .id { font-weight: 700; }
  .pill { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
          background: var(--soft); color: var(--accent); }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.completed { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .pill.expired { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .pill.failed, .pill.cancelled { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
  .pill.active::before { animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .cy .meta { display: flex; justify-content: space-between; margin-top: 4px; }
  .kv { margin-top: 10px; }
  .kv .k { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); }
  .kv .v { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  /* filters */
  .seg { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { flex: none; padding: 6px 13px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--hint); }
  .seg button.on { background: var(--accent); color: var(--accent-fg); border-color: transparent; }

  /* users */
  .user { display: flex; gap: 12px; align-items: center; }
  .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--soft); color: var(--accent); flex: none; }

  /* info */
  .info { white-space: pre-wrap; font: inherit; margin: 0; line-height: 1.6; }

  /* empty / skeleton */
  .empty { text-align: center; padding: 48px 16px; color: var(--hint); }
  .empty .big { font-size: 46px; margin-bottom: 8px; }
  .sk { height: 88px; border-radius: var(--r); margin-bottom: 10px; background: linear-gradient(90deg, var(--card) 25%, var(--line) 50%, var(--card) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }

  /* bottom */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px);
          border-top: 1px solid var(--line); padding: 10px 14px calc(8px + env(safe-area-inset-bottom)); }
  .dock .cta { margin-bottom: 8px; }
  nav { display: flex; }
  nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--hint); padding: 4px 0; }
  nav button.on { color: var(--accent); }

  #toast { position: fixed; top: 12px; left: 14px; right: 14px; z-index: 20; padding: 12px 14px; border-radius: 14px; background: var(--fg); color: var(--bg);
           font-weight: 600; text-align: center; transform: translateY(-140%); visibility: hidden; transition: transform .25s, visibility .25s; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  #toast.show { transform: none; visibility: visible; }
  #toast.err { background: var(--bad); color: #fff; }
  .fade { animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
</style>
</head>
<body>
<div id="toast"></div>
<header>
  <div class="logo">👻</div>
  <div class="grow"><h1>GhostRoute</h1><small id="ver"></small></div>
  <button class="chip" id="langBtn"></button>
</header>
<main id="view"></main>
<div class="dock"><div class="cta" id="cta"></div><nav id="nav"></nav></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); if (tg.themeParams && tg.themeParams.bg_color) document.documentElement.dataset.tg = "1"; }

const ICON = {
  home: '<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  cycles: '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>',
  info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  admin: '<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  wallet: '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  refresh: '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>',
};

const I18N = {
  en: {
    home: "Home", cycles: "Cycles", info: "Info", admin: "Admin",
    hops: "Hops", expiry: "Deposit window", min: "min", hopsU: "wallets",
    wallet: "Destination wallet", walletUnset: "No wallet set yet", walletOk: "Funds will arrive here",
    save: "Save", change: "Change", cancelEdit: "Cancel", start: "🚀  Start new route", cancelAll: "Cancel all active cycles",
    started: "Cycle started! Keys were sent to your chat.", noCycles: "No cycles yet", noCyclesSub: "Start a route from the Home tab.",
    hop: "Hop", cancel: "Cancel", extend: "+1 hr", relaunch: "Relaunch", confirm: "Are you sure?",
    source: "View source code", deposit: "Deposit address", destination: "Destination", expiresIn: "Expires in", expired: "Expired",
    copy: "Copy", copied: "Copied", users: "Users", master: "Master wallet", masterAddr: "Master address", masterKey: "Private key",
    masterSaved: "Master wallet saved.", notSet: "Not set", activeCycles: "Active", totalCycles: "Cycles", totalUsers: "Users",
    all: "All", details: "Details → chat", detailsSent: "Details sent to your chat.", keyWarn: "Sent over HTTPS and stored encrypted.",
    done: "Done", user: "User", cancelledAll: "Cancelled: ", extended: "Extended", walletSaved: "Wallet saved",
    status: { active: "Active", completed: "Completed", expired: "Expired", failed: "Failed", cancelled: "Cancelled" },
    noUsers: "No users yet", noneFound: "Nothing here", fresh: "Updated",
    e: {
      unauthorized: "Open this page from the Telegram bot.", forbidden: "Admins only.",
      invalid_address: "Invalid BSC address.", contract_not_allowed: "Contract addresses are not allowed.",
      set_wallet_first: "Set the destination wallet first.", start_bot_first: "Send /start to the bot first.",
      rate_limited: "Too fast — try again in a moment.", cycle_not_found: "Cycle not found.", invalid_cycle: "Invalid cycle.",
      already_done: "Cycle already finished.", cannot_extend: "Cannot extend this cycle.", only_expired: "Only expired cycles can be relaunched.",
      already_running: "Cycle is already running.", invalid_key: "Invalid private key.", key_mismatch: "Address and key do not match.",
      bad_request: "Invalid request.", bad_hops: "Hops must be 2–10.", bad_expiry: "Invalid time window.", net: "Network error.",
    },
  },
  fa: {
    home: "خانه", cycles: "چرخه‌ها", info: "راهنما", admin: "مدیر",
    hops: "تعداد هاپ", expiry: "مهلت واریز", min: "دقیقه", hopsU: "کیف پول",
    wallet: "کیف پول مقصد", walletUnset: "هنوز کیف پولی تنظیم نشده", walletOk: "وجه به این آدرس می‌رسد",
    save: "ذخیره", change: "تغییر", cancelEdit: "انصراف", start: "🚀  شروع مسیر جدید", cancelAll: "لغو همه چرخه‌های فعال",
    started: "چرخه شروع شد! کلیدها به چت شما ارسال شد.", noCycles: "هنوز چرخه‌ای نیست", noCyclesSub: "از تب خانه یک مسیر شروع کنید.",
    hop: "هاپ", cancel: "لغو", extend: "+۱ ساعت", relaunch: "راه‌اندازی مجدد", confirm: "مطمئن هستید؟",
    source: "مشاهده کد منبع", deposit: "آدرس واریز", destination: "مقصد", expiresIn: "انقضا تا", expired: "منقضی شد",
    copy: "کپی", copied: "کپی شد", users: "کاربران", master: "کیف پول اصلی", masterAddr: "آدرس کیف پول اصلی", masterKey: "کلید خصوصی",
    masterSaved: "کیف پول اصلی ذخیره شد.", notSet: "تنظیم نشده", activeCycles: "فعال", totalCycles: "چرخه", totalUsers: "کاربر",
    all: "همه", details: "جزئیات ← چت", detailsSent: "جزئیات به چت شما ارسال شد.", keyWarn: "از طریق HTTPS ارسال و رمزنگاری‌شده ذخیره می‌شود.",
    done: "انجام شد", user: "کاربر", cancelledAll: "لغو شد: ", extended: "تمدید شد", walletSaved: "کیف پول ذخیره شد",
    status: { active: "فعال", completed: "کامل", expired: "منقضی", failed: "ناموفق", cancelled: "لغو شده" },
    noUsers: "هنوز کاربری نیست", noneFound: "موردی نیست", fresh: "به‌روزرسانی",
    e: {
      unauthorized: "این صفحه را از داخل ربات تلگرام باز کنید.", forbidden: "فقط مدیران.",
      invalid_address: "آدرس BSC نامعتبر است.", contract_not_allowed: "آدرس قرارداد مجاز نیست.",
      set_wallet_first: "ابتدا کیف پول مقصد را تنظیم کنید.", start_bot_first: "ابتدا /start را به ربات بفرستید.",
      rate_limited: "خیلی سریع — کمی بعد دوباره تلاش کنید.", cycle_not_found: "چرخه پیدا نشد.", invalid_cycle: "چرخه نامعتبر.",
      already_done: "چرخه قبلاً تمام شده.", cannot_extend: "این چرخه قابل تمدید نیست.", only_expired: "فقط چرخه‌های منقضی قابل راه‌اندازی مجدد هستند.",
      already_running: "چرخه در حال اجراست.", invalid_key: "کلید خصوصی نامعتبر.", key_mismatch: "آدرس و کلید مطابقت ندارند.",
      bad_request: "درخواست نامعتبر.", bad_hops: "تعداد هاپ باید ۲ تا ۱۰ باشد.", bad_expiry: "مهلت نامعتبر.", net: "خطای شبکه.",
    },
  },
};

const S = { state: null, tab: "home", loaded: false, cycles: [], editWallet: false,
            admin: { sum: null, cycles: [], users: [], filter: "all" } };
const L = () => I18N[(S.state && S.state.setup.lang) || "fa"];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function html(tag, cls, svg) { const e = el(tag, cls); e.innerHTML = svg; return e; }
function btn(label, fn, cls) {
  const b = el("button", "btn " + (cls || ""), label);
  b.onclick = async () => { if (b.disabled) return; b.disabled = true; try { await fn(); } catch (e) { /* toast already shown */ } finally { b.disabled = false; } };
  return b;
}
function toast(msg, err) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (err ? " err" : "");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.className = "", 3200);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(err ? "error" : "success");
}
function ask(msg) { return new Promise(res => tg && tg.showConfirm ? tg.showConfirm(msg, res) : res(confirm(msg))); }
function copy(text) {
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).catch(() => {
    const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove();
  }).finally(() => toast(L().copied));
}
function short(a) { return a ? a.slice(0, 8) + "…" + a.slice(-6) : "—"; }
function ago(iso) {
  if (!iso) return "";
  const d = new Date(iso); return d.toLocaleString(S.state && S.state.setup.lang === "fa" ? "fa-IR" : undefined, { dateStyle: "medium", timeStyle: "short" });
}
function countdown(iso) {
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return L().expired;
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60);
  return h ? `${h}h ${m % 60}m` : `${m}m`;
}

async function api(method, path, body) {
  try {
    const r = await fetch(path, {
      method,
      headers: { "X-Telegram-Init-Data": tg ? tg.initData : "", "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const code = data.error || "bad_request"; throw new Error(L().e[code] || code); }
    return data;
  } catch (e) {
    const msg = e instanceof TypeError ? L().e.net : e.message;
    toast(msg, true); throw e;
  }
}

function kv(label, value, mono, copyable) {
  const w = el("div", "kv"); w.append(el("div", "k", label));
  const v = el("div", "v"); v.append(el("div", mono ? "mono" : "", value));
  if (copyable) { const c = html("button", "btn icon ghost", ICON.copy); c.onclick = () => copy(value); v.append(c); }
  w.append(v); return w;
}

function hopPath(total, current, status) {
  const p = el("div", "path mini");
  for (let i = 1; i <= total; i++) {
    const dot = document.createElement("i");
    if (status === "completed" || i < current) dot.className = "done";
    else if (i === current && status === "active") dot.className = "cur";
    p.append(dot);
    if (i < total) { const u = document.createElement("u"); if (status === "completed" || i < current) u.className = "done"; p.append(u); }
  }
  return p;
}

// ---------- cycle card ----------
function cycleCard(c, admin) {
  const l = L(), card = el("div", "card cy fade");
  const top = el("div", "top");
  top.append(el("span", "id", "#" + c.id.slice(-6)), el("span", "pill " + c.status, l.status[c.status] || c.status));
  card.append(top);
  const meta = el("div", "meta hint");
  meta.append(el("span", "", `${l.hop} ${c.current_hop}/${c.hops}`), el("span", "", ago(c.created_at)));
  card.append(meta, el("div", "", ""), hopPath(c.hops, c.current_hop, c.status));
  if (c.status === "active" && c.expires_at) card.append(kv(l.expiresIn, countdown(c.expires_at)));
  if (admin) card.append(kv(l.user, String(c.user_id), true));
  card.append(kv(l.destination, c.destination || "—", true, !!c.destination));
  if (c.status === "active" && c.deposit_address && !admin) card.append(kv(l.deposit, c.deposit_address, true, true));

  const acts = el("div", "acts");
  const run = (action) => async () => {
    if (action === "cancel" && !(await ask(l.confirm))) return;
    const path = admin && action === "cancel" ? `/api/admin/cycles/${c.id}/cancel` : `/api/cycles/${c.id}/${action}`;
    const r = await api("POST", path);
    toast(r.expires_at ? l.extended : l.done); await refresh();
  };
  if (c.status === "active" || c.status === "expired") {
    if (!admin) acts.append(btn(l.extend, run("extend"), "sec sm"));
    acts.append(btn(l.cancel, run("cancel"), "danger sm"));
  }
  if (c.status === "expired" && !admin) acts.append(btn(l.relaunch, run("relaunch"), "sec sm"));
  if (admin) acts.append(btn(l.details, async () => { await api("POST", `/api/admin/cycles/${c.id}/details`); toast(l.detailsSent); }, "sec sm"));
  if (acts.children.length) card.append(acts);
  return card;
}

function empty(icon, title, sub) {
  const e = el("div", "empty fade"); e.append(el("div", "big", icon), el("b", "", title));
  if (sub) e.append(el("div", "hint", sub)); return e;
}

// ---------- views ----------
function viewHome(v) {
  const s = S.state.setup, l = L();
  const tile = (label, valueText, sub, onMinus, onPlus, extra) => {
    const t = el("div", "tile"); t.append(el("div", "lbl", label));
    const ctl = el("div", "ctl");
    const val = el("div", "val", valueText); val.append(el("small", "", sub));
    ctl.append(btn("−", onMinus, "icon"), val, btn("+", onPlus, "icon"));
    t.append(ctl); if (extra) t.append(extra); return t;
  };
  const route = el("div", "path");
  for (let i = 0; i < s.hops; i++) { route.append(document.createElement("i")); if (i < s.hops - 1) route.append(document.createElement("u")); }
  const tiles = el("div", "tiles");
  tiles.append(
    tile(l.hops, String(s.hops), l.hopsU, () => setSetup({ hops: Math.max(2, s.hops - 1) }), () => setSetup({ hops: Math.min(10, s.hops + 1) }), route),
    tile(l.expiry, String(s.expiry_minutes), l.min, () => setSetup({ expiry_minutes: Math.max(30, s.expiry_minutes - 30) }), () => setSetup({ expiry_minutes: Math.min(480, s.expiry_minutes + 30) })),
  );
  v.append(tiles);

  const w = el("div", "card fade"), head = el("div", "wallet");
  head.append(html("div", "ic" + (s.destination ? " ok" : ""), ICON.wallet));
  const body = el("div", "body"); body.append(el("div", "hint", l.wallet),
    el("div", s.destination ? "mono" : "", s.destination || l.walletUnset));
  if (s.destination) body.append(el("div", "hint", l.walletOk));
  head.append(body);
  if (s.destination && !S.editWallet) head.append(btn(l.change, async () => { S.editWallet = true; render(); }, "sec sm"));
  w.append(head);
  if (!s.destination || S.editWallet) {
    const inp = el("input"); inp.placeholder = "0x…"; inp.spellcheck = false; inp.autocomplete = "off"; inp.autocapitalize = "off";
    const row = el("div", "acts");
    row.append(btn(l.save, async () => {
      if (!inp.value.trim()) return;
      await setSetup({ destination: inp.value.trim() }, true); S.editWallet = false; toast(l.walletSaved); render();
    }));
    if (S.editWallet) row.append(btn(l.cancelEdit, async () => { S.editWallet = false; render(); }, "ghost"));
    w.append(inp, row);
  }
  v.append(w);
  v.append(btn(l.cancelAll, async () => {
    if (!(await ask(l.confirm))) return;
    const r = await api("POST", "/api/cycles/cancel-all"); toast(l.cancelledAll + r.cancelled); await refresh();
  }, "ghost block"));
}

function viewCycles(v) {
  if (!S.loaded) { v.append(el("div", "sk"), el("div", "sk")); return; }
  if (!S.cycles.length) return v.append(empty("🌫️", L().noCycles, L().noCyclesSub));
  S.cycles.forEach(c => v.append(cycleCard(c, false)));
}

function viewInfo(v) {
  const c = el("div", "card fade"); c.append(el("pre", "info", S.state.setup.info.replace(/[*`_]/g, ""))); v.append(c);
  v.append(btn(L().source, async () => tg && tg.openLink ? tg.openLink(S.state.source_url) : window.open(S.state.source_url), "sec block"));
}

function viewAdmin(v) {
  const l = L(), a = S.admin;
  if (!S.loaded || !a.sum) { v.append(el("div", "sk"), el("div", "sk")); return; }
  const stats = el("div", "grid3 fade");
  [[a.sum.users, l.totalUsers], [a.sum.active, l.activeCycles], [a.sum.total, l.totalCycles]].forEach(([n, lbl]) => {
    const s = el("div", "stat"); s.append(el("b", "", String(n)), el("span", "", lbl)); stats.append(s);
  });
  v.append(stats);

  const m = el("div", "card fade"), head = el("div", "wallet");
  head.append(html("div", "ic" + (a.sum.master_address ? " ok" : ""), ICON.wallet));
  const body = el("div", "body"); body.append(el("div", "hint", l.master), el("div", a.sum.master_address ? "mono" : "", a.sum.master_address || l.notSet));
  head.append(body); m.append(head);
  const ai = el("input"); ai.placeholder = l.masterAddr; ai.spellcheck = false; ai.autocomplete = "off"; ai.autocapitalize = "off";
  const ki = el("input"); ki.placeholder = l.masterKey; ki.type = "password"; ki.autocomplete = "off";
  const row = el("div", "acts");
  row.append(btn(l.save, async () => {
    await api("POST", "/api/admin/set-master", { address: ai.value.trim(), key: ki.value.trim() });
    ai.value = ki.value = ""; toast(l.masterSaved); await refresh();
  }));
  m.append(ai, ki, el("div", "hint", l.keyWarn), row); v.append(m);

  v.append(el("h2", "", l.cycles));
  const seg = el("div", "seg");
  ["all", "active", "expired", "completed", "failed", "cancelled"].forEach(st => {
    const b = el("button", a.filter === st ? "on" : "", st === "all" ? l.all : l.status[st]);
    b.onclick = async () => { a.filter = st; await refresh(); }; seg.append(b);
  });
  v.append(seg);
  if (!a.cycles.length) v.append(empty("🔎", l.noneFound));
  a.cycles.forEach(c => v.append(cycleCard(c, true)));

  v.append(el("h2", "", `${l.users} · ${a.users.length}`));
  if (!a.users.length) v.append(empty("👥", l.noUsers));
  a.users.forEach(u => {
    const c = el("div", "card user fade"), name = u.name || String(u.user_id);
    const body = el("div", "body"); body.style.flex = 1;
    body.append(el("b", "", name), el("div", "hint", `${u.user_id}${u.username ? " · @" + u.username : ""}`));
    c.append(el("div", "av", name[0].toUpperCase()), body, el("span", "hint", ago(u.joined_at).split(",")[0]));
    v.append(c);
  });
}

function render() {
  const l = L(), st = S.state;
  document.documentElement.lang = st.setup.lang;
  document.documentElement.dir = st.setup.lang === "fa" ? "rtl" : "ltr";
  document.getElementById("langBtn").textContent = st.setup.lang === "fa" ? "EN" : "فا";
  document.getElementById("ver").textContent = st.version;

  const tabs = [["home", l.home, ICON.home], ["cycles", l.cycles, ICON.cycles], ["info", l.info, ICON.info]];
  if (st.is_admin) tabs.push(["admin", l.admin, ICON.admin]);
  const nav = document.getElementById("nav"); nav.replaceChildren();
  tabs.forEach(([k, label, icon]) => {
    const b = html("button", S.tab === k ? "on" : "", icon); b.append(el("span", "", label));
    b.onclick = async () => { S.tab = k; S.loaded = false; render(); await refresh(); window.scrollTo(0, 0); };
    nav.append(b);
  });

  const cta = document.getElementById("cta"); cta.replaceChildren();
  if (S.tab === "home") cta.append(btn(l.start, async () => {
    if (!(await ask(l.confirm))) return;
    await api("POST", "/api/cycles"); toast(l.started); S.tab = "cycles"; S.loaded = false; await refresh();
  }, "block"));

  const v = document.getElementById("view"); v.replaceChildren();
  ({ home: viewHome, cycles: viewCycles, info: viewInfo, admin: viewAdmin })[S.tab](v);
}

async function setSetup(changes, quiet) {
  S.state.setup = (await api("POST", "/api/setup", changes)).setup;
  if (!quiet) render();
}

async function refresh() {
  try {
    S.state = Object.assign(S.state || {}, await api("GET", "/api/state"));
    if (S.tab === "cycles") S.cycles = (await api("GET", "/api/cycles")).cycles;
    if (S.tab === "admin" && S.state.is_admin) {
      const q = S.admin.filter === "all" ? "" : "?status=" + S.admin.filter;
      const [sum, cy, us] = await Promise.all([api("GET", "/api/admin/summary"), api("GET", "/api/admin/cycles" + q), api("GET", "/api/admin/users")]);
      Object.assign(S.admin, { sum, cycles: cy.cycles, users: us.users });
    }
    S.loaded = true; render();
  } catch (e) {
    if (!S.state || !S.state.setup) document.getElementById("view").replaceChildren(empty("🔒", I18N.en.e.unauthorized));
  }
}

document.getElementById("langBtn").onclick = () => setSetup({ lang: S.state.setup.lang === "fa" ? "en" : "fa" }).catch(() => {});
document.getElementById("view").append(el("div", "sk"), el("div", "sk"));
refresh();
setInterval(() => { if (!document.hidden && S.tab === "cycles") refresh(); }, 15000);
setInterval(() => { if (!document.hidden && S.tab === "cycles" && S.loaded) render(); }, 30000);
</script>
</body>
</html>
